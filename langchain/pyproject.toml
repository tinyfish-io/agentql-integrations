[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "langchain-agentql"
version = "1.0.1"
description = "An integration package connecting AgentQL and LangChain"
authors = []
readme = "README.md"
repository = "https://github.com/tinyfish-io/agentql-integrations"
license = "MIT"

[tool.mypy]
disallow_untyped_defs = "True"

[tool.poetry.urls]
"Source Code" = "https://github.com/tinyfish-io/agentql-integrations/tree/main/langchain"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-core = ">=1.6.5,<2.0.0"
agentql = "^1.8.1"
playwright = "^1.50.0"
httpx = "^0.28.1"
langchain-community = "^0.4.2"
langchain-openai = "^1.6.6"
langchain-tests = "^1.1.9"
h11 = "^0.16.0"
urllib3 = ">=2.8.0"
langsmith = ">=0.8.18"
orjson = ">=3.11.6"
requests = ">=2.33.0"
pygments = ">=2.20.0"
aiohttp = ">=3.14.3"
python-dotenv = ">=1.2.2"
langchain = ">=1.4.2,<2.0.0"
idna = ">=3.15"
pydantic-settings = ">=2.14.2"
anyio = ">=4.15.1"
click = ">=8.3.3"
langchain-text-splitters = ">=1.1.2"

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.test_integration]
optional = true

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-socket = "^0.7.0"
pytest-watcher = "^0.3.4"
langchain-tests = "^1.1.9"
vcrpy = ">=8.2.1"

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.6"

[tool.poetry.group.test_integration.dependencies]

[tool.poetry.group.lint.dependencies]
ruff = "^0.5"

[tool.poetry.group.typing.dependencies]
mypy = "^1.10"
